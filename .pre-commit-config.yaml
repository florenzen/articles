repos:
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]

      - id: stylelint
        name: stylelint
        entry: node_modules/.bin/stylelint
        language: system
        types: [scss]

      - id: eslint
        name: eslint
        entry: node_modules/.bin/eslint
        language: system
        types: [javascript]

      - id: prettier
        name: prettier (format check)
        entry: node_modules/.bin/prettier --check
        language: system
        files: (\.(scss|m?js|json|ya?ml)|(^|/)\.(djlintrc|nsprc))$
        # Generated by npm and the Dev Containers CLI.
        exclude: (^|/)(package-lock|devcontainer-lock)\.json$

      - id: npm-audit
        name: npm audit (exceptions in .nsprc)
        entry: npm run --silent audit
        language: system
        # CI runs it on every push (pre-commit run --all-files), which also catches new advisories.
        files: ^(package(-lock)?\.json|\.nsprc)$
        pass_filenames: false

      - id: taplo-format
        name: taplo (TOML format check)
        entry: node_modules/.bin/taplo fmt --check
        language: system
        types: [toml]

      - id: taplo-lint
        name: taplo (TOML lint)
        entry: node_modules/.bin/taplo lint
        language: system
        types: [toml]

      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: shellcheck
        name: shellcheck (lint)
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt (format check)
        entry: shfmt --diff
        language: system
        types: [shell]

      - id: hadolint
        name: hadolint (Dockerfile lint)
        entry: hadolint
        language: system
        types: [dockerfile]

      - id: ruff
        name: ruff (lint)
        entry: ruff check
        language: system
        types: [python]

      - id: black
        name: black (format check)
        entry: black --check
        language: system
        types: [python]

      - id: djlint
        name: djlint (lint)
        entry: djlint --lint
        language: system
        files: ^templates/.*\.html$

      - id: djlint-format
        name: djlint (format check)
        entry: djlint --check
        language: system
        files: ^templates/.*\.html$

      - id: svg-no-text
        name: SVGs without text (fonts)
        entry: python3 scripts/image-metadata.py check-svg-text
        language: system
        files: ^content/.*\.svg$

      - id: image-metadata
        name: images (no location data, copyright and licence)
        entry: python3 scripts/image-metadata.py check
        language: system
        files: (?i)^content/.*\.(jpe?g|png|webp|gif|tiff?|svg)$
