base_url = "https://florenzen.github.io/articles"
title = "Articles"
description = "Articles by Florian Lorenzen"
default_language = "en"

compile_sass = true
build_search_index = false

generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "github-light"
error_on_missing_language = true

[link_checker]
# Bot protection answers 403 to requests from CI runners (GitHub Actions).
skip_prefixes = ["https://www.bauhaus.info/"]

[translations]
feed = "Feed"
min_read = "min read"
draft = "draft"
newer = "Newer"
older = "Older"
not_found = "Not found"
back_to_list = "Back to the article list"
other_language = "Deutsch"
theme = "Theme"
theme_system = "System"
theme_light = "Light"
theme_dark = "Dark"
enlarge = "Enlarge image"
image_viewer = "Image viewer"
previous_image = "Previous image"
next_image = "Next image"
close = "Close"
privacy = "Privacy"

