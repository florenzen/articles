name: Lint

# Not triggered by pushes itself: called from deploy.yml (main) and check.yml (other branches).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Keep the major version in sync with .devcontainer/devcontainer.json.
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          npm ci
          pip install -r requirements-dev.txt

      - name: Run linters and format checks
        run: pre-commit run --all-files
