name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build:
    needs: lint
    runs-on: ubuntu-latest
    # Zola comes from pkg.haus, which builds for Debian, not Ubuntu.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola
        run: sh .devcontainer/install-zola.sh

      # External links are checked on other branches (check.yml), so a site
      # that is down or blocks CI runners can't stop a deploy.
      - name: Check site
        run: zola check --skip-external-links

      - name: Build site
        run: zola build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
